events {}

http {
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=enroll_per_ip:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

  log_format audit '$time_iso8601 remote=$remote_addr employee=$employee_email method=$request_method '
                   'uri=$uri status=$status bytes=$body_bytes_sent request_time=$request_time';

  server {
    listen 8443 ssl;
    server_name 10.1.50.101;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    set $employee_email '-';
    access_log /var/log/nginx/access.log audit;
    server_tokens off;
    limit_req_status 429;

    location = /enroll {
      limit_req zone=enroll_per_ip burst=2 nodelay;
      client_max_body_size 8k;
      proxy_pass http://auth:8080/enroll;
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 15s;
    }

    location = /_auth {
      internal;
      proxy_pass http://auth:8080/auth;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Original-URI $request_uri;
    }

    location = /health {
      proxy_pass http://auth:8080/health;
    }

    location /v1/ {
      auth_request /_auth;
      auth_request_set $employee_email $upstream_http_x_employee_email;
      limit_req zone=api_per_ip burst=10 nodelay;
      limit_conn connections_per_ip 4;
      proxy_pass http://host.docker.internal:1919;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Authorization "";
    }

    location / {
      return 404;
    }
  }
}
