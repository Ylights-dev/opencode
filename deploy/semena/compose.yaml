services:
  auth:
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "/app/auth_server.py", "serve"]
    environment:
      AUTH_PEPPER: ${AUTH_PEPPER:?AUTH_PEPPER is required}
      AUTH_DB: /data/auth.db
      OPEN_WEBUI_SIGNIN_URL: http://host.docker.internal:3000/api/v1/auths/signin
    volumes:
      - ./auth_server.py:/app/auth_server.py:ro
      - ./data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 15s
      timeout: 5s
      retries: 10
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [backend]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:8443/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend]

networks:
  backend:
