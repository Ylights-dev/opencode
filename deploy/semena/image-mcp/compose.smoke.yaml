services:
  semena-image-mcp:
    build:
      context: .
      dockerfile: Dockerfile.smoke
    container_name: semena-image-mcp
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - HOST=0.0.0.0
      - PORT=3003
      - DATA_DIR=/data
      - MODEL_ID=Qwen/Qwen-Image-Edit-2511
      - DEVICE=cpu
      - PUBLIC_BASE_URL=http://10.1.50.40:3003
      - SEMENA_IMAGE_DRY_RUN=1
    volumes:
      - image-data:/data

volumes:
  image-data:
