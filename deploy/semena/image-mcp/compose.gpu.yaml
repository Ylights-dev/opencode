services:
  semena-image-mcp:
    build: .
    container_name: semena-image-mcp
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - HOST=0.0.0.0
      - PORT=3003
      - DATA_DIR=/data
      - MODEL_ID=Qwen/Qwen-Image-Edit-2511
      - TORCH_DTYPE=bfloat16
      - DEVICE=cuda
      - MAX_IMAGE_SIDE=1536
      - DEFAULT_STEPS=20
      - DEFAULT_GUIDANCE_SCALE=4.0
      - PUBLIC_BASE_URL=http://10.1.50.40:3003
      - SEMENA_IMAGE_DRY_RUN=${SEMENA_IMAGE_DRY_RUN:-0}
      - HF_HOME=/models/huggingface
    volumes:
      - image-data:/data
      - qwen-image-cache:/models/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  image-data:
  qwen-image-cache:
